<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Which bins go out this week.">
    <meta name="theme-color" content="#fff5fb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Bin Day">
    <title>Bin Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            padding: 20px 16px 40px;
            color: #6b2d52;
            font-family: Fredoka, "Segoe UI", sans-serif;
            background-color: #fff5fb;
            background-image:
                radial-gradient(circle at 8% 12%, #ffd0e8 0 90px, transparent 92px),
                radial-gradient(circle at 92% 6%, #fff1b8 0 64px, transparent 66px),
                radial-gradient(circle at 88% 78%, #c8ffe8 0 90px, transparent 92px),
                radial-gradient(circle at 12% 90%, #e4d4ff 0 60px, transparent 62px),
                radial-gradient(#ffc2d8 1.4px, transparent 1.5px);
            background-size: auto, auto, auto, auto, 18px 18px;
            overflow-x: hidden;
        }
        .float { position: fixed; pointer-events: none; color: #ff8fb8; font-size: 18px; }
        .float.a { top: 18px; right: 22px; }
        .float.b { top: 140px; left: 14px; color: #f0b429; font-size: 14px; }
        .float.c { bottom: 28px; right: 18px; color: #7dcea0; }
        #app { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; }
        .hello { display: flex; align-items: center; gap: 10px; margin: 8px 0 16px; }
        .hello img {
            width: 112px; height: 112px; object-fit: cover; background: #fff6e8;
            border-radius: 40% 60% 55% 45%; border: 4px solid #fff;
            box-shadow: 0 8px 0 #ffd0e6;
        }
        .bubble {
            position: relative; background: #fff; border: 3px solid #ffb3d1;
            border-radius: 24px 24px 24px 8px; padding: 12px 14px 12px 16px;
            box-shadow: 4px 4px 0 #ffe0f0;
        }
        .bubble::before {
            content: ""; position: absolute; left: -12px; bottom: 16px;
            border-width: 8px 12px 8px 0; border-style: solid;
            border-color: transparent #ffb3d1 transparent transparent;
        }
        .bubble strong { display: block; font-size: 26px; line-height: 1; color: #e44588; }
        .bubble span { font-size: 15px; }
        .view-toggle { display: flex; gap: 8px; margin: 14px 0; }
        .btn {
            border: 2px solid #ffd0e6; background: #fff; color: #e56b9a;
            border-radius: 999px; padding: 8px 14px; font: inherit; cursor: pointer;
        }
        .btn.active { background: #ff8fb8; color: #fff; border-color: #ff8fb8; }
        .section-title { margin: 8px 6px; font-size: 18px; }
        .bin-date { margin: 0 6px 10px; font-size: 14px; color: #c46b93; }
        .stickers { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 8px; }
        .sticker {
            position: relative; width: 142px; height: 142px;
            border-radius: 48% 52% 50% 50%; border: 5px solid #fff;
            box-shadow: 0 0 0 3px #ffd6e8, 0 8px 0 rgba(255, 143, 184, 0.35);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 8px;
        }
        .stickers .sticker:nth-child(3n+1) { transform: rotate(-8deg); }
        .stickers .sticker:nth-child(3n+2) { transform: rotate(7deg); }
        .stickers .sticker:nth-child(3n) { transform: rotate(-3deg); }
        .spark { position: absolute; top: 10px; right: 16px; font-size: 12px; color: #f0b429; }
        .face { display: flex; gap: 10px; }
        .face i { width: 12px; height: 14px; background: #4a2438; border-radius: 50%; display: block; position: relative; }
        .face i::after { content: ""; position: absolute; width: 4px; height: 4px; background: #fff; border-radius: 50%; top: 2px; left: 2px; }
        .blush { display: flex; gap: 18px; }
        .blush b { width: 12px; height: 7px; background: #ff9bb8; border-radius: 50%; display: block; }
        .smile { width: 18px; height: 8px; border-bottom: 2px solid #4a2438; border-radius: 0 0 12px 12px; }
        .sticker strong { font-size: 15px; line-height: 1.1; margin-top: 2px; }
        .sticker small { font-size: 12px; }
        .sticker.asleep { width: 108px; height: 108px; opacity: 0.85; filter: saturate(0.75); transform: rotate(-6deg); }
        .sticker.asleep .face i { height: 7px; background: transparent; border-bottom: 2px solid #4a2438; border-radius: 0 0 10px 10px; }
        .sticker.asleep .face i::after { display: none; }
        .sticker.green { background: #d1fae5; color: #065f46; }
        .sticker.red { background: #fee2e2; color: #991b1b; }
        .sticker.yellow { background: #fef9c3; color: #854d0e; }
        .sticker.blue { background: #dbeafe; color: #1e3a8a; }
        .sticker.black { background: #e5e7eb; color: #111827; }
        .sticker.brown { background: #f5e6d3; color: #78350f; }
        .sticker.grey, .sticker.gray { background: #f3f4f6; color: #374151; }
        .sticker.pink { background: #fce7f3; color: #9d174d; }
        .sticker.purple { background: #ede9fe; color: #5b21b6; }
        .sticker.orange { background: #ffedd5; color: #9a3412; }
        .sticker.default { background: #e2e8f0; color: #334155; }
        .cluster { background: #fff; border: 3px solid #ffe0ee; border-radius: 22px; padding: 12px; margin-bottom: 10px; box-shadow: 3px 3px 0 #ffd6e8; }
        .cluster.now { border-color: #ff8fb8; }
        .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .pills span { border-radius: 999px; padding: 4px 8px; font-size: 13px; }
        .pills .green { background: #d1fae5; color: #065f46; }
        .pills .red { background: #fee2e2; color: #991b1b; }
        .pills .yellow { background: #fef9c3; color: #854d0e; }
        .pills .blue { background: #dbeafe; color: #1e3a8a; }
        .pills .black { background: #e5e7eb; color: #111827; }
        .pills .brown { background: #f5e6d3; color: #78350f; }
        .pills .grey, .pills .gray { background: #f3f4f6; color: #374151; }
        .pills .pink { background: #fce7f3; color: #9d174d; }
        .pills .purple { background: #ede9fe; color: #5b21b6; }
        .pills .orange { background: #ffedd5; color: #9a3412; }
        .pills .default { background: #e2e8f0; color: #334155; }
        .settings-toggle {
            display: block; margin: 0 auto 8px; padding: 8px 14px; border-radius: 999px;
            border: 2px solid #ffd0e6; background: #fff; color: #c46b93; font: inherit; cursor: pointer;
        }
        .settings-panel {
            background: #fff; border: 3px solid #ffd0e6; border-radius: 22px;
            box-shadow: 4px 4px 0 #ffe0f0; padding: 16px; margin: 8px 0 14px; color: #6b2d52;
        }
        .settings-panel h3 { font-size: 16px; margin: 8px 0; }
        .settings-row { margin-bottom: 12px; }
        .settings-row label { display: block; font-size: 13px; margin-bottom: 4px; }
        .settings-row input, .settings-row select {
            width: 100%; max-width: 280px; padding: 8px 10px; border-radius: 12px;
            border: 2px solid #ffd0e6; font: inherit; background: #fff;
        }
        .bin-list-item { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
        .bin-list-item input[type="text"] { flex: 1; min-width: 120px; padding: 8px 10px; border-radius: 12px; border: 2px solid #ffd0e6; font: inherit; }
        .bin-list-item .week-checks { display: flex; gap: 8px; flex-wrap: wrap; }
        .bin-list-item .week-checks label { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; }
        .btn-small { padding: 6px 10px; border-radius: 999px; border: 2px solid #ffd0e6; background: #fff; color: #6b2d52; font: inherit; cursor: pointer; }
        .btn-small.danger { border-color: #fca5a5; color: #b91c1c; }
        .add-bin-btn { margin-top: 6px; }
        @media (max-width: 380px) {
            .sticker { width: 124px; height: 124px; }
            .hello img { width: 92px; height: 92px; }
        }
</style>
</head>
<body>
    <span class="float a" aria-hidden="true">♡</span>
    <span class="float b" aria-hidden="true">✦</span>
    <span class="float c" aria-hidden="true">♡</span>
    <div id="app">
        <div class="hello">
            <img src="icons/icon-512.png" alt="">
            <div class="bubble">
                <strong id="helloTitle">hiii~</strong>
                <span id="subtitle">Tuesday morning ♡</span>
            </div>
        </div>

        <button class="settings-toggle" id="settingsToggle" type="button">tweak schedule</button>
        <div class="settings-panel" id="settingsPanel" hidden>
            <h3>Schedule</h3>
            <div class="settings-row">
                <label>Collection day of week</label>
                <select id="collectionDay">
                    <option value="0">Sunday</option>
                    <option value="1">Monday</option>
                    <option value="2">Tuesday</option>
                    <option value="3">Wednesday</option>
                    <option value="4">Thursday</option>
                    <option value="5">Friday</option>
                    <option value="6">Saturday</option>
                </select>
            </div>
            <div class="settings-row">
                <label>Schedule start date (Monday of first cycle week)</label>
                <input type="date" id="scheduleStartDate">
            </div>
            <div class="settings-row">
                <label>Cycle length (weeks)</label>
                <input type="number" id="cycleLength" min="1" max="52" value="2">
            </div>
            <h3>Bins</h3>
            <div class="bin-list" id="binList"></div>
            <button class="btn-small add-bin-btn" id="addBinBtn" type="button">+ Add bin</button>
        </div>

        <div class="view-toggle">
            <button class="btn" id="viewWeek" type="button">This week</button>
            <button class="btn" id="viewCalendar" type="button">Calendar</button>
        </div>

        <div id="weekView">
            <h2 class="section-title" id="weekTitle">peel these out ♡</h2>
            <p class="bin-date" id="nextBinDate"></p>
            <div id="weekOut" class="stickers"></div>
            <h2 class="section-title" id="napTitle">shhh, napping</h2>
            <div id="weekNap" class="stickers"></div>
        </div>

        <div id="calendarView" hidden>
            <h2 class="section-title">eight weeks~</h2>
            <div id="calendarWeeks"></div>
        </div>
    </div>

    <script>
        (function () {
            const STORAGE_KEY = 'binday-config';
            const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

            function defaultConfig() {
                return {
                    scheduleStartDate: '2026-01-05',
                    collectionDayOfWeek: 2,
                    cycleLength: 2,
                    bins: [
                        { name: 'Green Bin', weeksInCycle: [0, 1] },
                        { name: 'Red Bin', weeksInCycle: [0] },
                        { name: 'Yellow Bin', weeksInCycle: [1] }
                    ]
                };
            }

            function loadConfig() {
                try {
                    var raw = localStorage.getItem(STORAGE_KEY);
                    if (!raw) return defaultConfig();
                    var parsed = JSON.parse(raw);
                    var config = { ...defaultConfig(), ...parsed };
                    if (!Array.isArray(config.bins) || config.bins.length === 0) config.bins = defaultConfig().bins;
                    config.bins = config.bins.map(function (b) {
                        return {
                            name: b.name || 'Bin',
                            weeksInCycle: (Array.isArray(b.weeksInCycle) ? b.weeksInCycle : [0]).map(function (n) { return Math.max(0, parseInt(n, 10) || 0); })
                        };
                    });
                    config.cycleLength = Math.max(1, Math.min(52, parseInt(config.cycleLength, 10) || 2));
                    config.collectionDayOfWeek = Math.max(0, Math.min(6, parseInt(config.collectionDayOfWeek, 10)));
                    config.bins.forEach(function (b) {
                        b.weeksInCycle = b.weeksInCycle.filter(function (w) { return w >= 0 && w < config.cycleLength; });
                        if (b.weeksInCycle.length === 0) b.weeksInCycle = [0];
                    });
                    return config;
                } catch (_) {
                    return defaultConfig();
                }
            }

            function saveConfigToStorage(config) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    scheduleStartDate: config.scheduleStartDate,
                    collectionDayOfWeek: config.collectionDayOfWeek,
                    cycleLength: config.cycleLength,
                    bins: config.bins.map(function (b) {
                        return { name: b.name, weeksInCycle: (b.weeksInCycle || []).slice() };
                    })
                }));
            }

            var COLOR_MAP = [
                { keys: ['green'], c: 'green' }, { keys: ['red'], c: 'red' }, { keys: ['yellow'], c: 'yellow' },
                { keys: ['blue'], c: 'blue' }, { keys: ['black'], c: 'black' }, { keys: ['brown'], c: 'brown' },
                { keys: ['grey', 'gray'], c: 'grey' }, { keys: ['pink'], c: 'pink' }, { keys: ['purple'], c: 'purple' },
                { keys: ['orange'], c: 'orange' }
            ];
            function colorClass(name) {
                if (!name || typeof name !== 'string') return 'default';
                var lower = name.toLowerCase();
                for (var i = 0; i < COLOR_MAP.length; i++) {
                    var item = COLOR_MAP[i];
                    if (item.keys.some(function (k) { return lower.indexOf(k) !== -1; })) return item.c;
                }
                return 'default';
            }

            var EMOJI_MAP = { green: '🟢', red: '🔴', yellow: '🟡', blue: '🔵', black: '⬛', brown: '🟤', grey: '⚪', gray: '⚪', pink: '🩷', purple: '🟣', orange: '🟠' };
            function binEmoji(name) {
                if (!name || typeof name !== 'string') return '🗑️';
                var lower = name.toLowerCase();
                for (var key in EMOJI_MAP) { if (lower.indexOf(key) !== -1) return EMOJI_MAP[key]; }
                return '🗑️';
            }

            function formatDate(date) {
                return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            }

            function getNextBinDay(config) {
                var today = new Date();
                var todayDay = today.getDay();
                var target = config.collectionDayOfWeek;
                var daysUntil = (target - todayDay + 7) % 7;
                if (daysUntil === 0) daysUntil = 7;
                var next = new Date(today);
                next.setDate(today.getDate() + daysUntil);
                next.setHours(0, 0, 0, 0);
                return next;
            }

            /** Monday of the week that contains the given date (Mon–Sun). */
            function getWeekStart(date) {
                var d = new Date(date);
                var day = d.getDay();
                var diff = day === 0 ? -6 : 1 - day;
                var monday = new Date(d);
                monday.setDate(d.getDate() + diff);
                monday.setHours(0, 0, 0, 0);
                return monday;
            }

            /** Collection day (e.g. Tuesday) that falls in the same week as date. */
            function getCollectionDayInWeek(config, date) {
                var weekStart = getWeekStart(date);
                var collectionDate = new Date(weekStart);
                var daysToAdd = config.collectionDayOfWeek === 0 ? 6 : config.collectionDayOfWeek - 1; // Mon=0, Tue=1, ..., Sun=6
                collectionDate.setDate(weekStart.getDate() + daysToAdd);
                collectionDate.setHours(0, 0, 0, 0);
                return collectionDate;
            }

            function getBinsForWeek(config, weekStart) {
                var start = new Date(config.scheduleStartDate + 'T00:00:00');
                var msPerWeek = 7 * 24 * 60 * 60 * 1000;
                var weeksDiff = Math.floor((weekStart.getTime() - start.getTime()) / msPerWeek);
                var cycleIndex = ((weeksDiff % config.cycleLength) + config.cycleLength) % config.cycleLength;
                return config.bins.map(function (bin) {
                    var weeks = bin.weeksInCycle || [];
                    return weeks.some(function (w) { return w === cycleIndex; });
                });
            }

            var state = {
                config: loadConfig(),
                currentView: 'week',
                showSettings: false
            };

            function escapeHtml(s) {
                var div = document.createElement('div');
                div.textContent = s;
                return div.innerHTML;
            }

            function renderSubtitle() {
                var day = DAY_NAMES[state.config.collectionDayOfWeek] || 'Tuesday';
                var el = document.getElementById('subtitle');
                if (el) el.textContent = day + ' morning ♡';
                var hello = document.getElementById('helloTitle');
                if (hello) hello.textContent = state.currentView === 'calendar' ? 'plan ahead~' : 'hiii~';
            }

            function renderSettingsPanel() {
                var panel = document.getElementById('settingsPanel');
                var toggle = document.getElementById('settingsToggle');
                if (panel) panel.hidden = !state.showSettings;
                if (toggle) toggle.textContent = state.showSettings ? 'hide schedule' : 'tweak schedule';

                document.getElementById('collectionDay').value = String(state.config.collectionDayOfWeek);
                document.getElementById('scheduleStartDate').value = state.config.scheduleStartDate || '2026-01-05';
                document.getElementById('cycleLength').value = String(state.config.cycleLength);

                var binList = document.getElementById('binList');
                binList.innerHTML = '';
                state.config.bins.forEach(function (bin, index) {
                    var item = document.createElement('div');
                    item.className = 'bin-list-item';
                    var nameInput = document.createElement('input');
                    nameInput.type = 'text';
                    nameInput.placeholder = 'Bin name (e.g. Green bin)';
                    nameInput.value = bin.name;
                    nameInput.dataset.binIndex = String(index);
                    nameInput.addEventListener('input', function () {
                        state.config.bins[index].name = nameInput.value;
                        saveConfigToStorage(state.config);
                    });
                    var weekChecks = document.createElement('div');
                    weekChecks.className = 'week-checks';
                    for (var w = 0; w < state.config.cycleLength; w++) {
                        var lab = document.createElement('label');
                        var cb = document.createElement('input');
                        cb.type = 'checkbox';
                        cb.value = String(w);
                        cb.checked = (bin.weeksInCycle || []).indexOf(w) !== -1;
                        cb.dataset.binIndex = String(index);
                        cb.dataset.weekIndex = String(w);
                        cb.addEventListener('change', function () {
                            var i = parseInt(this.dataset.binIndex, 10);
                            var wi = parseInt(this.dataset.weekIndex, 10);
                            var arr = state.config.bins[i].weeksInCycle || [];
                            if (this.checked) {
                                if (arr.indexOf(wi) === -1) arr.push(wi);
                            } else {
                                state.config.bins[i].weeksInCycle = arr.filter(function (x) { return x !== wi; });
                                if (state.config.bins[i].weeksInCycle.length === 0) state.config.bins[i].weeksInCycle = [0];
                                saveConfigToStorage(state.config);
                                render();
                                return;
                            }
                            state.config.bins[i].weeksInCycle = arr.slice().sort(function (a, b) { return a - b; });
                            saveConfigToStorage(state.config);
                            render();
                        });
                        lab.appendChild(cb);
                        lab.appendChild(document.createTextNode(' W' + w));
                        weekChecks.appendChild(lab);
                    }
                    var removeBtn = document.createElement('button');
                    removeBtn.className = 'btn-small danger';
                    removeBtn.type = 'button';
                    removeBtn.textContent = 'Remove';
                    removeBtn.addEventListener('click', function () {
                        state.config.bins.splice(index, 1);
                        if (state.config.bins.length === 0) state.config.bins = [{ name: 'Bin', weeksInCycle: [0] }];
                        saveConfigToStorage(state.config);
                        render();
                    });
                    item.appendChild(nameInput);
                    item.appendChild(weekChecks);
                    item.appendChild(removeBtn);
                    binList.appendChild(item);
                });
            }

            function renderViews() {
                var today = new Date();
                today.setHours(0, 0, 0, 0);
                var nextBinDay = getNextBinDay(state.config);
                var thisWeekCollectionDay = getCollectionDayInWeek(state.config, today);
                // Once we've passed this week's collection day, show the next collection's week
                var currentWeekStart = today > thisWeekCollectionDay
                    ? getWeekStart(nextBinDay)
                    : getWeekStart(today);
                var currentWeekBins = getBinsForWeek(state.config, currentWeekStart);

                document.getElementById('nextBinDate').textContent = 'next up · ' + formatDate(nextBinDay);

                function makeSticker(bin, active) {
                    var sticker = document.createElement('div');
                    sticker.className = 'sticker ' + colorClass(bin.name) + (active ? '' : ' asleep');
                    sticker.innerHTML = '<span class="spark">' + (active ? '✦' : 'zzz') + '</span>' +
                        '<div class="face"><i></i><i></i></div><div class="blush"><b></b><b></b></div><div class="smile"></div>' +
                        '<strong>' + escapeHtml(bin.name) + '</strong><small>' + (active ? 'out!!' : 'napping') + '</small>';
                    return sticker;
                }

                var weekOut = document.getElementById('weekOut');
                var weekNap = document.getElementById('weekNap');
                var napTitle = document.getElementById('napTitle');
                var weekTitle = document.getElementById('weekTitle');
                weekOut.innerHTML = '';
                weekNap.innerHTML = '';
                var outCount = 0;
                var napCount = 0;
                state.config.bins.forEach(function (bin, index) {
                    var active = currentWeekBins[index];
                    (active ? weekOut : weekNap).appendChild(makeSticker(bin, active));
                    if (active) outCount += 1; else napCount += 1;
                });
                weekTitle.textContent = outCount ? 'peel these out ♡' : 'everybody stays home';
                weekOut.hidden = outCount === 0;
                napTitle.hidden = napCount === 0;
                weekNap.hidden = napCount === 0;

                var calendarWeeksEl = document.getElementById('calendarWeeks');
                calendarWeeksEl.innerHTML = '';
                var currentWeekTime = currentWeekStart.getTime();
                for (var i = 0; i < 8; i++) {
                    var weekStart = new Date(currentWeekStart);
                    weekStart.setDate(weekStart.getDate() + (i * 7));
                    var binsThisWeek = getBinsForWeek(state.config, weekStart);
                    var isCurrent = weekStart.getTime() === currentWeekTime;
                    var collection = getCollectionDayInWeek(state.config, weekStart);
                    var weekItem = document.createElement('div');
                    weekItem.className = 'cluster' + (isCurrent ? ' now' : '');
                    var weekDate = document.createElement('b');
                    weekDate.textContent = collection.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + (isCurrent ? ' · next!' : '');
                    weekItem.appendChild(weekDate);
                    var weekBins = document.createElement('div');
                    weekBins.className = 'pills';
                    state.config.bins.forEach(function (bin, idx) {
                        if (!binsThisWeek[idx]) return;
                        var pill = document.createElement('span');
                        pill.className = colorClass(bin.name);
                        pill.textContent = bin.name;
                        weekBins.appendChild(pill);
                    });
                    weekItem.appendChild(weekBins);
                    calendarWeeksEl.appendChild(weekItem);
                }
            }

            function renderViewToggle() {
                document.getElementById('weekView').hidden = state.currentView !== 'week';
                document.getElementById('calendarView').hidden = state.currentView !== 'calendar';
                document.getElementById('viewWeek').className = 'btn' + (state.currentView === 'week' ? ' active' : '');
                document.getElementById('viewCalendar').className = 'btn' + (state.currentView === 'calendar' ? ' active' : '');
                renderSubtitle();
            }

            function render() {
                renderSubtitle();
                renderSettingsPanel();
                renderViews();
                renderViewToggle();
            }

            document.getElementById('settingsToggle').addEventListener('click', function () {
                state.showSettings = !state.showSettings;
                render();
            });

            document.getElementById('collectionDay').addEventListener('change', function () {
                state.config.collectionDayOfWeek = parseInt(this.value, 10);
                saveConfigToStorage(state.config);
                render();
            });

            document.getElementById('scheduleStartDate').addEventListener('input', function () {
                state.config.scheduleStartDate = this.value || '2026-01-05';
                saveConfigToStorage(state.config);
                render();
            });

            document.getElementById('cycleLength').addEventListener('change', function () {
                var n = Math.max(1, Math.min(52, parseInt(this.value, 10) || 2));
                state.config.cycleLength = n;
                state.config.bins.forEach(function (b) {
                    b.weeksInCycle = (b.weeksInCycle || []).filter(function (w) { return w >= 0 && w < n; });
                    if (b.weeksInCycle.length === 0) b.weeksInCycle = [0];
                });
                saveConfigToStorage(state.config);
                render();
            });

            document.getElementById('addBinBtn').addEventListener('click', function () {
                state.config.bins.push({ name: 'New Bin', weeksInCycle: [0] });
                saveConfigToStorage(state.config);
                render();
            });

            document.getElementById('viewWeek').addEventListener('click', function () {
                state.currentView = 'week';
                renderViewToggle();
            });

            document.getElementById('viewCalendar').addEventListener('click', function () {
                state.currentView = 'calendar';
                renderViewToggle();
            });

            render();
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () {});
            });
        }
    </script>
</body>
</html>
